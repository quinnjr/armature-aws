[package]
name = "armature-aws"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-aws"
homepage = "https://quinnjr.github.io/armature"
description = "AWS cloud services integration for Armature - dynamically loadable and DI-ready"
keywords = ["aws", "cloud", "s3", "dynamodb", "lambda"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["sync"] }
async-trait = "0.1"

# SDK default features are off to drop the legacy hyper-0.14 client and its
# h2 0.3 (RUSTSEC-2026-0258); the hyper-1 `default-https-client` is kept.
# AWS SDK - core
aws-config = { version = "1.12" }
aws-credential-types = { version = "1.3" }
aws-types = { version = "1.6" }
# Held below 1.7 so a fresh resolve (Cargo.lock is not committed) picks the
# aws-sdk-*/aws-runtime releases that still build with aws-config 1.12's
# aws-smithy-json 0.63. Drop this once aws-config moves to aws-smithy-json 0.64.
aws-smithy-types = { version = ">=1.6.3, <1.7" }

# AWS SDK - services (all optional)
# The aws-sdk-* requirements stop one release short of the newest: those
# releases require aws-smithy-types 1.7, which breaks aws-smithy-json 0.63
# (`Document::Object` became `DocumentObject`), and aws-config 1.12 -- the
# newest -- still depends on aws-smithy-json 0.63. Move these forward once an
# aws-config release requires aws-smithy-json 0.64.
aws-sdk-s3 = { version = "1.146", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-dynamodb = { version = "1.124", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sqs = { version = "1.109", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sns = { version = "1.111", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sesv2 = { version = "1.133", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-lambda = { version = "1.144", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-secretsmanager = { version = "1.115", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-ssm = { version = "1.122", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-cloudwatch = { version = "1.128", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-kinesis = { version = "1.119", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-eventbridge = { version = "1.116", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"], optional = true }
aws-sdk-ecs = { version = "1.144", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-ecr = { version = "1.127", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-rds = { version = "1.148", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-elasticache = { version = "1.117", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-cognito-idp = { version = "1.133", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true, package = "aws-sdk-cognitoidentityprovider" }
aws-sdk-kms = { version = "1.118", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }
aws-sdk-sts = { version = "1.114", default-features = false, features = ["sigv4a", "default-https-client", "rt-tokio"], optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Utilities
tracing = "0.1"
parking_lot = "0.12"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }

[features]
default = []
# Individual services
s3 = ["aws-sdk-s3"]
dynamodb = ["aws-sdk-dynamodb"]
sqs = ["aws-sdk-sqs"]
sns = ["aws-sdk-sns"]
ses = ["aws-sdk-sesv2"]
lambda = ["aws-sdk-lambda"]
secrets-manager = ["aws-sdk-secretsmanager"]
ssm = ["aws-sdk-ssm"]
cloudwatch = ["aws-sdk-cloudwatch"]
kinesis = ["aws-sdk-kinesis"]
eventbridge = ["aws-sdk-eventbridge"]
ecs = ["aws-sdk-ecs"]
ecr = ["aws-sdk-ecr"]
rds = ["aws-sdk-rds"]
elasticache = ["aws-sdk-elasticache"]
cognito = ["aws-sdk-cognito-idp"]
kms = ["aws-sdk-kms"]
sts = ["aws-sdk-sts"]
# Service groups
storage = ["s3", "dynamodb"]
messaging = ["sqs", "sns", "kinesis", "eventbridge"]
compute = ["lambda", "ecs"]
security = ["secrets-manager", "kms", "cognito", "sts"]
# All services
all = ["storage", "messaging", "compute", "security", "ses", "ssm", "cloudwatch", "ecr", "rds", "elasticache"]

